<!DOCTYPE html>
<html>
<head>
  <title>Iscrizione Corsi - 3DMakes</title>
</head>
<body>
  <!-- Questo file aiuta Netlify a riconoscere il form di iscrizione ai corsi -->
  <form name="iscrizione-corsi" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="firstName" />
    <input type="text" name="lastName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <select name="timeSlot">
      <option value="">Seleziona uno slot</option>
      <option value="10-11-settembre">10-11 Settembre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="17-18-settembre">17-18 Settembre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="24-25-settembre">24-25 Settembre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="1-2-ottobre">1-2 Ottobre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="8-9-ottobre">8-9 Ottobre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="15-16-ottobre">15-16 Ottobre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="22-23-ottobre">22-23 Ottobre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="29-30-ottobre">29-30 Ottobre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="5-6-novembre">5-6 Novembre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="12-13-novembre">12-13 Novembre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="19-20-novembre">19-20 Novembre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="26-27-novembre">26-27 Novembre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="3-4-dicembre">3-4 Dicembre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="10-11-dicembre">10-11 Dicembre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="17-18-dicembre">17-18 Dicembre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
      <option value="24-25-dicembre">24-25 Dicembre 2026 (Giovedì-Venerdì) - 17:30 - 21:30</option>
    </select>
    <textarea name="message"></textarea>
    <input type="checkbox" name="privacy" />
  </form>
</body>
</html>
